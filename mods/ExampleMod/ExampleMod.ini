; ExampleMod settings. Changes are picked up while the game is running.
;
; Keys can be a name (F1-F24, A-Z, 0-9, NUMPAD0-NUMPAD9, INSERT, DELETE, HOME, END,
; PAGEUP, PAGEDOWN) or a virtual-key code such as 0x78.

[Keys]
ToggleGodMode=F9
RefillCores=F10

[Display]
; Show "God mode" in the top-right corner while it is on.
ShowStatus=1
